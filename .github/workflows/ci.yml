name: 'CI'

on:
  push:
    branches: ['main', '1.x']
  pull_request:
  schedule:
    - cron: '0 0 * * *' # Every night: everything but the documentation URLs
    - cron: '0 1 1 * *' # Every month: the documentation URLs

permissions:
  contents: 'read'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DAGGER_VERSION: '1.0.0-beta.28'
  DAGGER_NO_NAG: '1'

jobs:
  checks:
    name: 'Checks'
    if: github.event.schedule != '0 1 1 * *'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 'PHP CS Fixer'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: 'php-cs-fixer check'

      - name: 'PHPStan'
        if: ${{ !cancelled() }}
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: 'test phpstan'

      - name: 'Validate composer files and dependencies'
        if: ${{ !cancelled() }}
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: 'test validate-dependencies'

      - name: 'Generate docs'
        id: 'generate-docs'
        if: ${{ !cancelled() }}
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: 'generate-docs'
          dagger-flags: '--progress plain --auto-apply'

      - name: 'Check documentation'
        if: ${{ !cancelled() && steps.generate-docs.outcome == 'success' }}
        run: |
          DIFF=$(git status --short --renames ./docs)
          if [[ $DIFF != '' ]]; then
            echo "::warning::Builders API documentation is not up to date. Please run \"dagger --auto-apply call generate-docs\""
            echo "::warning::$DIFF"
            exit 1
          fi

  doc-urls:
    name: 'Validate URL docs'
    if: github.event_name != 'schedule' || github.event.schedule == '0 1 1 * *'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 'Validate URLS into PhpDoc'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: 'test validate-url-doc'

  matrix:
    name: 'Setup matrix'
    if: github.event.schedule != '0 1 1 * *'
    runs-on: 'ubuntu-latest'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 'Build matrix'
        id: 'build-matrix'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: 'matrix'
          dagger-flags: '--silent'

      - id: 'set-matrix'
        env:
          MATRIX: ${{ steps.build-matrix.outputs.output }}
        run: |
          echo "matrix=$(jq -c '.' <<< "$MATRIX")" >> "$GITHUB_OUTPUT"

  tests:
    name: 'Build and Test - ${{ matrix.name }}'
    runs-on: 'ubuntu-latest'
    needs: 'matrix'
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 'Run test suite'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: "test --symfony-version '${{ matrix.symfony-version }}' --php-version '${{ matrix.php }}' --minimum-stability '${{ matrix.minimum-stability }}' phpunit"
