name: 'CI'

on:
  push:
    branches: ['main', '1.x']
  pull_request:
  schedule:
    - cron: '0 0 * * *' # Every night: everything but the documentation URLs
    - cron: '0 1 1 * *' # Every month: the documentation URLs

permissions:
  contents: 'read'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DAGGER_VERSION: '1.0.0-beta.28'
  DAGGER_NO_NAG: '1'

jobs:
  checks:
    name: 'Checks'
    if: github.event.schedule != '0 1 1 * *'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run the checks'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: 'check'

  doc-urls:
    name: 'Validate URL docs'
    if: github.event_name != 'schedule' || github.event.schedule == '0 1 1 * *'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Validate URLS into PhpDoc'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: 'test validate-url-doc'

  tests:
    name: 'Tests'
    if: github.event.schedule != '0 1 1 * *'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install Dagger'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: 'Run PHPUnit on the whole matrix'
        shell: 'bash'
        run: dagger --progress plain call phpunit-matrix | tee -a "$GITHUB_STEP_SUMMARY"
